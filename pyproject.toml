[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".venv",
  "venv",
  "__pycache__",
  "templates",
  "Databanks",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "B",
  "I",
]
ignore = [
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["dicom_discovery", "extract_metadata", "process_dicom", "store_metadata", "translations"]
